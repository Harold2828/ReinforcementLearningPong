services:
  backend:
    build:
      context: ./Server
    env_file:
      - .env.example
    environment:
      FLASK_DEBUG: "false"
      EVOLUTION_TRAINING_ENABLED: "1"
      EVOLUTION_DATA_PATH: /app/evolution_data
      EVOLUTION_ROUND_TICKS: "150"
      EVOLUTION_STEPS_PER_AGENT: "100000"
      EVOLUTION_REPLAY_WARMUP: "16"
      EVOLUTION_REPLAY_CAPACITY: "2048"
      EVOLUTION_BATCH_SIZE: "16"
      EVOLUTION_DEVICE: cpu
      EVOLUTION_SNAPSHOT_INTERVAL: "10"
      EVOLUTION_OPTIMIZER_INTERVAL: "32"
      EVOLUTION_TORCH_THREADS: "1"
      EVOLUTION_TORCH_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    ports:
      - "5001:5001"
    volumes:
      - q_learning_models:/app/models
      - evolution_data:/app/evolution_data

  frontend:
    build:
      context: ./PongGame
      args:
        VITE_BACKEND_URL: http://localhost:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  q_learning_models:
  evolution_data:
